<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Scheduling Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Process Scheduling Simulator</h1>

    <div class="controls">
        <label>Select Algorithm:</label>
        <select id="algorithm">
            <option value="fcfs">First-Come, First-Served (FCFS)</option>
            <option value="sjf">Shortest Job First (SJF - Non-Preemptive)</option>
            <option value="priority">Priority Scheduling (Non-Preemptive)</option>
            <option value="rr">Round Robin (RR)</option>
        </select>
        
        <label>Time Quantum (for RR):</label>
        <input type="number" id="timeQuantum" value="2" min="1" disabled>

        <button onclick="addProcess()">Add Process</button>
        <button onclick="simulate()">Simulate</button>
    </div>

    <table id="processTable">
        <thead>
            <tr>
                <th>Process ID</th>
                <th>Arrival Time</th>
                <th>Burst Time</th>
                <th>Priority</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h2>Gantt Chart</h2>
    <div id="ganttChart"></div>

    <h2>Results</h2>
    <table id="resultsTable">
        <thead>
            <tr>
                <th>Process ID</th>
                <th>Completion Time (CT)</th>
                <th>Turnaround Time (TAT)</th>
                <th>Waiting Time (WT)</th>
                <th>Response Time (RT)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    
    <p id="avgResults"></p>

    <script src="script.js"></script>
</body>
</html>
